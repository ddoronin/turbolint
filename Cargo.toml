[workspace]
members = [
    "crates/turbolint_parser",
    "crates/turbolint_core",
    "crates/turbolint_config",
    "crates/turbolint_rules",
    "crates/turbolint_cli",
]
resolver = "2"

[workspace.package]
version = "0.11.0"

[workspace.dependencies]
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
colored = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
