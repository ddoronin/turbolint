[workspace]

[workspace.package]
version = "0.2.0"
members = [
    "crates/turbolint_parser",
    "crates/turbolint_core",
    "crates/turbolint_config",
    "crates/turbolint_rules",
    "crates/turbolint_cli",
]
resolver = "2"

[workspace.dependencies]
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
