name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    name: Check if version needs publishing
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check npm registry
        id: check
        run: |
          VERSION=$(node -p "require('./npm/rslint/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view rslint@"$VERSION" version 2>/dev/null; then
            echo "Version $VERSION already published, skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION not found on npm, will publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            npm_pkg: cli-darwin-arm64
            binary: rslint
          - target: x86_64-apple-darwin
            os: macos-13
            npm_pkg: cli-darwin-x64
            binary: rslint
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            npm_pkg: cli-linux-x64
            binary: rslint
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            npm_pkg: cli-linux-arm64
            binary: rslint
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            npm_pkg: cli-linux-x64-musl
            binary: rslint
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm_pkg: cli-win32-x64
            binary: rslint.exe

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }}

      - name: Copy binary to npm package
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} npm/${{ matrix.npm_pkg }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm_pkg }}
          path: npm/${{ matrix.npm_pkg }}/

  publish:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    name: Publish npm packages
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy binaries into npm packages
        run: |
          for pkg in cli-darwin-arm64 cli-darwin-x64 cli-linux-x64 cli-linux-arm64 cli-linux-x64-musl cli-win32-x64; do
            cp -r artifacts/$pkg/* npm/$pkg/
          done

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in cli-darwin-arm64 cli-darwin-x64 cli-linux-x64 cli-linux-arm64 cli-linux-x64-musl cli-win32-x64; do
            npm publish npm/$pkg --provenance --access public
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm/rslint --provenance --access public
